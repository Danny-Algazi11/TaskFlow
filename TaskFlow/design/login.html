<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<style>
  body{ min-height:100vh; display:flex; }
  .brand-panel{
    width:44%; background:var(--ink); color:white; display:flex; flex-direction:column;
    justify-content:space-between; padding:48px; position:relative; overflow:hidden;
  }
  .brand-panel .logo{ display:flex; align-items:center; gap:9px; }
  .brand-panel .logo .mark{ width:26px; height:26px; border-radius:8px; background:var(--blue); }
  .brand-panel .logo .word{ font-family:'Poppins', sans-serif; font-weight:700; font-size:19px; }
  .brand-panel .message{ max-width:380px; }
  .brand-panel .message h1{ font-family:'Poppins', sans-serif; font-weight:700; font-size:2.1rem; line-height:1.25; margin-bottom:16px; }
  .brand-panel .message p{ color:#B7BBD1; font-size:14.5px; line-height:1.6; }
  .brand-panel .fine{ font-size:12px; color:#8489A6; }
  .brand-panel .deco{ position:absolute; right:-140px; top:-60px; opacity:0.5; }

  .form-panel{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px; }
  .form-box{ width:360px; }
  .form-box h2{ font-family:'Poppins', sans-serif; font-weight:700; font-size:1.7rem; margin-bottom:6px; }
  .form-box .sub{ color:var(--ink-dim); font-size:14px; margin-bottom:28px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-dim); }
  .field input{
    height:44px; border-radius:var(--radius-sm); border:1px solid var(--line);
    padding:0 14px; font-size:14.5px; font-family:'Inter', sans-serif; color:var(--ink);
    outline:none;
  }
  .field input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,111,237,0.15); }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .link-sm{ font-size:12.5px; font-weight:600; color:var(--blue); }
  .submit-btn{ width:100%; height:44px; margin-top:6px; justify-content:center; }
  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0; }
  .divider .line{ flex:1; height:1px; background:var(--line); }
  .divider span{ font-size:11.5px; color:var(--ink-faint); font-weight:700; }
  .switch-line{ text-align:center; font-size:14px; color:var(--ink-dim); }
  .switch-line a{ font-weight:700; color:var(--blue); }

  @media (max-width: 860px){
    .brand-panel{ display:none; }
  }
</style>
</head>
<body>

<div class="brand-panel">
  <svg class="deco" width="480" height="480" viewBox="0 0 480 480">
    <rect x="40" y="80" width="100" height="280" rx="14" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="160" y="40" width="100" height="200" rx="14" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="280" y="120" width="100" height="240" rx="14" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="55" y="100" width="70" height="42" rx="8" fill="var(--blue)" opacity="0.9"/>
    <rect x="55" y="152" width="70" height="32" rx="8" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="175" y="60" width="70" height="38" rx="8" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="175" y="112" width="70" height="32" rx="8" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="295" y="140" width="70" height="32" rx="8" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
    <rect x="295" y="182" width="70" height="42" rx="8" fill="none" stroke="#2A2F55" stroke-width="1.5"/>
  </svg>

  <div class="logo">
    <div class="mark"></div>
    <span class="word">Task<span style="color:var(--blue);">Flow</span></span>
  </div>

  <div class="message">
    <h1 class="poppins">A simple board for you and your team</h1>
    <p>Track tasks, move cards, and stay in sync - one board your whole team actually opens every day.</p>
  </div>

  <div class="fine">TaskFlow - a solo-built board manager, 2026</div>
</div>

<div class="form-panel">
  <div class="form-box">
    <h2 class="poppins">Welcome back</h2>
    <div class="sub">Sign in to pick up where your team left off.</div>

    <div class="field">
      <label>Email address</label>
      <input type="text" value="laila@productteam.co">
    </div>

    <div class="field">
      <div class="row-between">
        <label>Password</label>
        <a href="#" class="link-sm">Forgot?</a>
      </div>
      <input type="password" value="password123">
    </div>

    <button class="btn btn-primary submit-btn">Sign in</button>

    <div class="divider"><div class="line"></div><span>OR</span><div class="line"></div></div>

    <div class="switch-line">New to TaskFlow? <a href="#">Start for free</a></div>
  </div>
</div>

</body>
</html>
